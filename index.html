<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Platform</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-shell">
      <div class="login-box">
        <section class="brand-panel">
          <div class="badge">Üdvözöllek az oldalon!</div>
          <h1>Jelentkezz be<br />a munkaterületedre.</h1>
          <p>
            Hova szeretnél be jelentkezni?
          </p>
        </section>

        <section class="form-panel">
          <h2>Belépés</h2>
          <p class="subtitle">Használd a fiókod adatait</p>

          <form class="login-form">
            <div class="field-group">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="Írd be az email címed" />
            </div>

            <div class="field-group">
              <label for="password">Jelszó</label>
              <input id="password" type="password" placeholder="Add meg a jelszavad" />
            </div>

            <button class="primary-btn" type="submit">Lépj be</button>

            <div class="divider">Ha máshová szeretnél belépni</div>

            <div class="social-login">
              <button class="social-btn" type="button"><a href="https://accounts.google.com/v3/signin/identifier?continue=https://accounts.google.com/signin/chrome/sync/finish?est%3DACkCusunDo39npnkvToCeZxp4yJlL56pfkE5vSCkcEqnbivcK1XElwuK4nZk0pmd_-5-7bnjmw0Vz4aGm7UwX-4%26continue%3Dhttps://www.google.com/&flow=history_opt_in&ssp=1&theme=mn&flowName=GlifDesktopChromeSync&dsh=S-32489362:1792509088171320">Google</a></button>
              <button class="social-btn" type="button"><a href="https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=your_client_id&response_type=code&redirect_uri=your_redirect_uri&scope=your_scopes">Microsoft</a></button>
              <button class="social-btn" type="button"><a href="https://appleid.apple.com/auth/authorize?client_id=your_client_id&response_type=code&redirect_uri=your_redirect_uri&scope=your_scopes">Apple</a></button>
              <button class="social-btn" type="button"><a href="https://www.facebook.com/">Facebook</a></button>
            </div>
          </form>

        </section>
      </div>
    </div>
  </body>
</html>
